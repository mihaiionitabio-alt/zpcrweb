<rect x="915" y="193" width="940" height="805" rx="30" fill="#100b16" stroke="#65456e"/>
<text x="945" y="237" font-size="26" fill="#ff9966" font-weight="bold" text-anchor="start">EXPLORE · ASK QUESTIONS · PLAY</text>
<text x="945" y="275" font-size="22" fill="#ff9966" font-weight="normal" text-anchor="start">•</text>
<text x="966" y="275" font-size="22" fill="#e6d3ec" font-weight="normal" text-anchor="start">Learn real-time PCR data review by exploring, asking questions and playing.</text>
<text x="945" y="309" font-size="22" fill="#ff9966" font-weight="normal" text-anchor="start">•</text>
<text x="966" y="309" font-size="22" fill="#e6d3ec" font-weight="normal" text-anchor="start">A learning game plus two demos: a guided tour and a voice-command workflow.</text>
<text x="966" y="335" font-size="22" fill="#e6d3ec" font-weight="normal" text-anchor="start">Artificial data, highlighted evidence, questions and points. Download a</text>
<text x="966" y="361" font-size="22" fill="#e6d3ec" font-weight="normal" text-anchor="start">training report with answers, scores and time.</text>
<text x="945" y="395" font-size="22" fill="#ff9966" font-weight="normal" text-anchor="start">•</text>
<text x="966" y="395" font-size="22" fill="#e6d3ec" font-weight="normal" text-anchor="start">A single, unencrypted HTML file.</text>
<text x="945" y="429" font-size="22" fill="#ff9966" font-weight="normal" text-anchor="start">•</text>
<text x="966" y="429" font-size="22" fill="#e6d3ec" font-weight="normal" text-anchor="start">Free and open source. Save it and use it offline.</text>
<text x="945" y="463" font-size="22" fill="#ff9966" font-weight="normal" text-anchor="start">•</text>
<text x="966" y="463" font-size="22" fill="#e6d3ec" font-weight="normal" text-anchor="start">Local processing and multiple instrument file formats.</text>
<text x="945" y="497" font-size="22" fill="#ff9966" font-weight="normal" text-anchor="start">•</text>
<text x="966" y="497" font-size="22" fill="#e6d3ec" font-weight="normal" text-anchor="start">Interactive amplification curves and control charts.</text>
<text x="945" y="531" font-size="22" fill="#ff9966" font-weight="normal" text-anchor="start">•</text>
<text x="966" y="531" font-size="22" fill="#e6d3ec" font-weight="normal" text-anchor="start">Stored threshold-cycle, melting and quantity results, where available.</text>
<text x="945" y="565" font-size="22" fill="#ff9966" font-weight="normal" text-anchor="start">•</text>
<text x="966" y="565" font-size="22" fill="#e6d3ec" font-weight="normal" text-anchor="start">SOP rules for controls and replicates.</text>
<text x="945" y="599" font-size="22" fill="#ff9966" font-weight="normal" text-anchor="start">•</text>
<text x="966" y="599" font-size="22" fill="#e6d3ec" font-weight="normal" text-anchor="start">Outliers, drift and missing channel results.</text>
<text x="945" y="633" font-size="22" fill="#ff9966" font-weight="normal" text-anchor="start">•</text>
<text x="966" y="633" font-size="22" fill="#e6d3ec" font-weight="normal" text-anchor="start">English and Chinese interfaces.</text>
<text x="945" y="667" font-size="22" fill="#ff9966" font-weight="normal" text-anchor="start">•</text>
<text x="966" y="667" font-size="22" fill="#e6d3ec" font-weight="normal" text-anchor="start">Mouse, keyboard and optional voice commands on compatible browsers, with</text>
<text x="966" y="693" font-size="22" fill="#e6d3ec" font-weight="normal" text-anchor="start">offline audio.</text>
<rect x="944" y="920" width="882" height="57" rx="14" fill="#08050b" stroke="#cc99cc"/>
<text x="960" y="945" font-size="21" fill="#ffcc99" font-weight="bold" text-anchor="start">Research use only. MISSY is not validated.</text>
<text x="960" y="969" font-size="20" fill="#e6d3ec" font-weight="normal" text-anchor="start">The game supports practice, not competency certification.</text>
<text x="105" y="708" font-size="18" fill="#e6d3ec">Recorded speech: compressed MP3, embedded in the HTML.</text><text x="105" y="732" font-size="18" fill="#e6d3ec">Offline after saving. Optional English voice pack: one-time download.</text></svg>