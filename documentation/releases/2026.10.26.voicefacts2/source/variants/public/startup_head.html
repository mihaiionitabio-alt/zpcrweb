<script>
/* Startup presentation only. Progress counts completed startup stages, not download bytes. */
(()=>{
 document.documentElement.classList.add('missy-starting');
 const bootStart=performance.now(),completed=[];
 let failed=false,ready=false,current=0,label='Loading interface';
 const components=['Shell / interface / embedded styles','Plotly chart engine','IXO / EDS / EDT / RDML / ZPCR / PCRD readers + ZIP archive support','Full PDF font / bilingual interface / public extensions','SOP profiles / Console / keyboard / voice / sound library'];
 const details=['Document shell and embedded CSS parsed','Chart engine script evaluated','Embedded readers evaluated; experiment data not read','Embedded font and extension scripts evaluated','DOM ready; reader API and voice controls present'];
 const ms=n=>n.toFixed(1)+' ms';
 const paint=()=>{const text=document.getElementById('missy-startup-status'),bar=document.getElementById('missy-startup-progress'),fill=document.getElementById('missy-startup-fill');if(text)text.textContent=label;if(bar){bar.setAttribute('aria-valuenow',String(current));bar.setAttribute('aria-valuetext',label);}if(fill)fill.style.width=(current/5*100)+'%';const count=document.getElementById('startup-stage-count');if(count)count.textContent=current+' / 5';document.querySelectorAll('#missy-startup [data-boot-step]').forEach(e=>e.classList.toggle('is-loaded',Number(e.dataset.bootStep)<=current));const log=document.getElementById('missy-startup-log');if(log){const lines=['Elapsed since startup script; stage intervals include HTML parsing.'];components.slice(0,Math.min(current+1,5)).forEach((name,i)=>{const done=completed[i];lines.push((done?'[OK]   ':'[LOAD] ')+name);if(done)lines.push('       '+ms(done.end)+' elapsed | '+ms(done.duration)+' stage interval  -  '+details[i]);});if(current===5){lines.push('[READY] Initialization complete in '+ms(completed[4].end));lines.push('[DATA]  No experiment files read during startup.');lines.push('[ENTER] Click the MISSY logo');}if(failed)lines.push('[ERROR] Startup initialization failed.');log.textContent=lines.join('\n');log.scrollTop=log.scrollHeight;}};
 const fail=()=>{if(ready||failed)return;failed=true;const enter=document.getElementById('missy-startup-enter');if(enter){enter.disabled=true;enter.classList.remove('is-ready');}label='Startup failed. Please reload.';paint();const retry=document.getElementById('missy-startup-retry');if(retry)retry.hidden=false;};
 window.MISSY_STARTUP=Object.freeze({stage(n,text){if(failed||ready)return;const next=Math.max(current,Math.min(5,n)),end=performance.now()-bootStart;for(let i=current;i<next;i++){const previous=i?completed[i-1].end:0;completed[i]={end,duration:end-previous};}current=next;label=text;paint();}});
 window.addEventListener('error',e=>{if(e instanceof ErrorEvent)fail();});
 document.addEventListener('DOMContentLoaded',()=>{paint();const retry=document.getElementById('missy-startup-retry');if(retry)retry.onclick=()=>location.reload();requestAnimationFrame(()=>{if(failed)return;if(!window.__qc||!document.getElementById('missy-console-voice-controls')){fail();return;}window.MISSY_STARTUP.stage(5,'Ready — click the MISSY logo to enter.');const enter=document.getElementById('missy-startup-enter');enter.disabled=false;enter.classList.add('is-ready');enter.onclick=()=>{if(failed||ready)return;ready=true;document.documentElement.classList.remove('missy-starting');if(window.MISSY_SETUP&&!window.__MISSY_DEMO_FRAME){window.MISSY_SETUP.open();return;}performance.mark('missy-page-ready');document.dispatchEvent(new Event('missy-ready'));};performance.mark('missy-initialized');document.dispatchEvent(new Event('missy-initialized'));});},{once:true});
})();
</script>

<!--
  MACHINE-READABLE LANDING-PAGE METADATA
  This source-level graph describes the application even before JavaScript runs.
  After local .ixo files are read, the page replaces this graph in memory with a
  DataCatalog containing one Dataset per experiment and DataDownload nodes for
  every export that the decoded content can actually produce. No local path or
  experiment value is transmitted; the graph remains inside this offline page.
-->
<script id="machine-metadata" type="application/ld+json">
